<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cəngəllik qaçışı – Jungle Runner</title><link rel="stylesheet" href="runner.css"></head><body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
 <div id="hl"><div id="hearts"></div><div class="chip"><i class="coin"></i><b id="coins">0</b></div><div class="chip"><i class="relic"></i><b id="relics">0/3</b></div></div>
 <div id="timer">0:00</div>
 <div id="hr"><button id="pause" class="ibtn">❚❚</button></div>
 <div id="prog"><i id="progfill"></i><s id="progdot"></s></div>
</div>
<div id="tip"></div><div id="pop"></div><div id="power"></div>
<div id="start" class="glass"><h1>Cəngəllik qaçışı</h1><p>Toxun – tullan, basılı saxla – daha yüksək. Böcəyin üstünə düş, yarasadan qaç, 3 yaşıl relikti tap!</p><div id="levels"></div><button id="exit" class="btn">← Çıxış</button></div>
<div id="end" class="glass hidden"><h1 id="end-title"></h1><div id="end-stars"></div><div id="end-stats"></div><div class="row"><button id="again" class="btn big">⟲ Yenidən</button><button id="next" class="btn big pri">Növbəti ▶</button><button id="menu2" class="btn big">☰</button></div></div>
<div id="pausep" class="glass hidden"><h1>Fasilə</h1><div class="row"><button id="resume" class="btn big pri">▶ Davam</button><button id="restart" class="btn big">⟲</button><button id="menu3" class="btn big">☰</button></div></div>
<script src="runner.js"></script></body></html>
