<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pirat İmperiyası</title><link rel="stylesheet" href="empire.css"></head><body>
<canvas id="c"></canvas>
<div id="labels"></div><div id="fxl"></div>
<div id="top"><button id="back" class="rb">←</button><div class="pill gold"><i>🪙</i><b id="gold">0</b></div><div class="day" id="day">GÜN 1</div><div class="pill inc"><span id="inc">+0/s</span></div></div>
<div id="bar"><button data-t="ships"><i>⛵</i><span>Gəmilər</span></button><button data-t="islands"><i>🏝️</i><span>Adalar</span></button><button data-t="laws"><i>📜</i><span>Qanunlar</span></button><button data-t="daily" id="dailyb"><i>🎁</i><span>Hədiyyə</span></button></div>
<div id="sheet" class="hidden"><div class="card"><div class="head"><b id="stitle"></b><button id="sclose" class="rb">✕</button></div><div id="sbody"></div></div></div>
<div id="toast"></div>
<script src="empire.js"></script></body></html>
